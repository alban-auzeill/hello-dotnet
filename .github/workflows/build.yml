name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: 'zulu' # Alternative distribution options are available.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Compute SonarQube Cloud cache period
        shell: bash
        # 182 days (6 months), shifted by the repository id so repositories don't all refresh on the same day
        run: echo "SONAR_CACHE_PERIOD=$(( ($(date +%s) / 86400 + GITHUB_REPOSITORY_ID % 182) / 182 ))" >> "$GITHUB_ENV"
      - name: Cache SonarQube Cloud packages and scanner
        id: cache-sonar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\.sonar\cache
          key: ${{ runner.os }}-${{ runner.arch }}-sonar-${{ env.SONAR_CACHE_PERIOD }}
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar.outputs.cache-hit != 'true'
        shell: powershell
        run: dotnet tool update dotnet-sonarscanner --tool-path "$env:USERPROFILE\.sonar\cache\scanner"
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          & "$env:USERPROFILE\.sonar\cache\scanner\dotnet-sonarscanner" begin /k:"alban-auzeill_hello-dotnet" /o:"alban-auzeill" /d:sonar.token="$env:SONAR_TOKEN" &&
          dotnet build &&
          & "$env:USERPROFILE\.sonar\cache\scanner\dotnet-sonarscanner" end /d:sonar.token="$env:SONAR_TOKEN"

          # Not chained with "&&" so the cache is listed even when the analysis fails.
          # Get-ChildItem is a cmdlet, so $LASTEXITCODE (the step result) keeps the exit code of the chain above.
          Get-ChildItem -LiteralPath "$env:USERPROFILE\.sonar\cache" -Recurse -Force |
            Format-Table Mode, LastWriteTime, Length, FullName -AutoSize |
            Out-String -Width 4096
