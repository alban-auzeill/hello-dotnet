name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu' # Alternative distribution options are available.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube Cloud packages and scanner
        id: cache-sonar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\.sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar.outputs.cache-hit != 'true'
        shell: powershell
        run: dotnet tool update dotnet-sonarscanner --tool-path "$env:USERPROFILE\.sonar\cache\scanner"
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          # Diagnostic: compare with `printf %s "$TOKEN" | shasum` locally without exposing the token
          $tokenBytes = [System.Text.Encoding]::UTF8.GetBytes("$env:SONAR_TOKEN")
          $tokenSha1 = -join ([System.Security.Cryptography.SHA1]::Create().ComputeHash($tokenBytes) | ForEach-Object { $_.ToString("x2") })
          Write-Host "SONAR_TOKEN length: $("$env:SONAR_TOKEN".Length)"
          Write-Host "SONAR_TOKEN sha1: $tokenSha1"

          # Windows PowerShell does not stop on native command failures, so check each exit code
          & "$env:USERPROFILE\.sonar\cache\scanner\dotnet-sonarscanner" begin /k:"alban-auzeill_hello-dotnet" /o:"alban-auzeill" /d:sonar.token="$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:USERPROFILE\.sonar\cache\scanner\dotnet-sonarscanner" end /d:sonar.token="$env:SONAR_TOKEN"
